AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Provision 4-table DynamoDB operational telemetry and Phase 2 ingest-state
  schema plus the ap-southeast-1 pipeline S3 bucket with On-Demand billing,
  SSE, PITR, Retain policies, lifecycle rules, CORS, and TLS-only access.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: "aws-cloudformation@3"
  com.aws.cloudformation.Context:
    arch: "4-table DynamoDB store (recording, haul-cycle, state-segment, ingest-state with GSI_ACTIVE_UPLOADS) + S3 pipeline bucket; math constants live client-side in SwiftData settings"
    must:
      - "Preserve DeletionPolicy/UpdateReplacePolicy Retain on all stateful tables and PipelineBucket"
      - "Include mandatory Owner/Project/Iteration tags across all taggable resources"
      - "Keep Primary Keys aligned with database_schema_plan.md literals (recording_id, cycle_id, segment_id)"
    ref:
      - at: ../AIMLC4_Playground/docs/database_schema_plan.md
        has: 3-table ERD, PKs, and SwiftData decoupling specification
        scope: schema
      - at: ../AIMLC4_Playground/docs/aws_architecture_plan.md
        has: DynamoDB PAY_PER_REQUEST operational storage tier specification
        scope: architecture
    owner: project8

Parameters:
  TablePrefix:
    Type: String
    Default: ovius
    AllowedPattern: "^[a-z0-9-]+$"
    MinLength: 2
    MaxLength: 32
    ConstraintDescription: TablePrefix must contain only lowercase letters, numbers, and hyphens (2-32 chars).
    Description: Prefix applied to all provisioned DynamoDB table names.

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment tag.

  EnablePointInTimeRecovery:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable DynamoDB continuous point-in-time recovery backups.

  PipelineBucketName:
    Type: String
    Default: ovius-pipeline-apse1-610331148578
    AllowedPattern: "^[a-z0-9.-]+$"
    MinLength: 3
    MaxLength: 63
    ConstraintDescription: PipelineBucketName must be a valid lowercase S3 bucket name (3-63 chars).
    Description: S3 bucket name for video upload staging, checkpoints, Lambda artifacts, and Parquet lake.

Resources:
  RecordingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores 12-hour CCTV shift metadata and camera selectors; camera-id-timestamp-index enables Section Date Horizon queries without full table scans
        must:
          - "Keep recording_id as partition key matching SwiftData section resolver"
        mutable: change-with-constraints
    Properties:
      TableName: !Sub "${TablePrefix}-recording"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recording_id
          AttributeType: S
        - AttributeName: camera_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: recording_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: camera-id-timestamp-index
          KeySchema:
            - AttributeName: camera_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !Ref EnablePointInTimeRecovery
      Tags:
        - Key: Owner
          Value: project8
        - Key: Project
          Value: AIMLC4
        - Key: Iteration
          Value: v5
        - Key: Environment
          Value: !Ref EnvironmentName

  HaulCycleTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Uses cycle_id PK per ERD literal with recording-id-index (sorted by t_load_start_s) and recording-excavator-index GSIs for per-shift chronological and per-loader queries
        must:
          - "Never hardcode volume payload constants in table items"
          - "Keep recording-id-index and recording-excavator-index projected ALL so cycle scoops[] arrays return without extra lookups"
        mutable: must-never-change
        mutability:
          GlobalSecondaryIndexes: change-with-constraints
          Tags: free-to-tune
    Properties:
      TableName: !Sub "${TablePrefix}-haul-cycle"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cycle_id
          AttributeType: S
        - AttributeName: recording_id
          AttributeType: S
        - AttributeName: t_load_start_s
          AttributeType: N
        - AttributeName: excavator_sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: cycle_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: recording-id-index
          KeySchema:
            - AttributeName: recording_id
              KeyType: HASH
            - AttributeName: t_load_start_s
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: recording-excavator-index
          KeySchema:
            - AttributeName: recording_id
              KeyType: HASH
            - AttributeName: excavator_sort_key
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !Ref EnablePointInTimeRecovery
      Tags:
        - Key: Owner
          Value: project8
        - Key: Project
          Value: AIMLC4
        - Key: Iteration
          Value: v5
        - Key: Environment
          Value: !Ref EnvironmentName

  StateSegmentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores scoop-granular machine state timeline using segment_id PK per ERD literal with recording-id-index (timeline order by start_s) and cycle-id-index (cycle reconstruction via cycle_sort_key)
        must:
          - "Throttle bulk writes containing cycle_id=NONE cleanly within single GSI partition write limits during initial seed upload"
        mutable: must-never-change
        mutability:
          GlobalSecondaryIndexes: change-with-constraints
          Tags: free-to-tune
    Properties:
      TableName: !Sub "${TablePrefix}-state-segment"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: segment_id
          AttributeType: S
        - AttributeName: recording_id
          AttributeType: S
        - AttributeName: start_s
          AttributeType: N
        - AttributeName: cycle_id
          AttributeType: S
        - AttributeName: cycle_sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: segment_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: recording-id-index
          KeySchema:
            - AttributeName: recording_id
              KeyType: HASH
            - AttributeName: start_s
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: cycle-id-index
          KeySchema:
            - AttributeName: cycle_id
              KeyType: HASH
            - AttributeName: cycle_sort_key
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !Ref EnablePointInTimeRecovery
      Tags:
        - Key: Owner
          Value: project8
        - Key: Project
          Value: AIMLC4
        - Key: Iteration
          Value: v5
        - Key: Environment
          Value: !Ref EnvironmentName

  IngestStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Orchestrates Phase 2 resumable multipart uploads, WORKER#LOCK leases, WebSocket subscriptions, and O(1) min(ETA) Batch keep-warm decisions via sparse GSI_ACTIVE_UPLOADS
        must:
          - "Keep GSI1SK numeric (N) so ascending ScanIndexForward=true orders upload_eta_s numerically without Limit=1 pre-filter hiding"
          - "Keep StreamViewType NEW_IMAGE and TTL expires_at enabled"
        mutable: change-with-constraints
    Properties:
      TableName: !Sub "${TablePrefix}-ingest-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_ACTIVE_UPLOADS
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !Ref EnablePointInTimeRecovery
      Tags:
        - Key: Owner
          Value: project8
        - Key: Project
          Value: AIMLC4
        - Key: Iteration
          Value: v5
        - Key: Environment
          Value: !Ref EnvironmentName

  PipelineBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Central ap-southeast-3 S3 bucket for multipart video upload staging (uploads/), tracker checkpoints, Lambda artifacts (artifacts/), and Parquet analytics lake (parquet/)
        must:
          - "Preserve DeletionPolicy and UpdateReplacePolicy Retain"
          - "Keep PublicAccessBlockConfiguration all-true and BucketOwnerEnforced"
          - "Keep AbortIncompleteMultipartUpload=1d on uploads/ and CORS ExposedHeaders=[ETag]"
        mutable: change-with-constraints
    Properties:
      BucketName: !Ref PipelineBucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads1Day
            Status: Enabled
            Prefix: uploads/
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: TransitionAnalyticsParquetToGlacier90Days
            Status: Enabled
            Prefix: parquet/
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      Tags:
        - Key: Owner
          Value: project8
        - Key: Project
          Value: AIMLC4
        - Key: Iteration
          Value: v5
        - Key: Environment
          Value: !Ref EnvironmentName

  PipelineBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Enforce TLS-only access to the pipeline S3 bucket for uploads, artifacts, and analytics reads
        must:
          - "Deny all non-HTTPS requests via aws:SecureTransport=false"
        mutable: change-with-constraints
    Properties:
      Bucket: !Ref PipelineBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt PipelineBucket.Arn
              - !Sub "${PipelineBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  RecordingTableName:
    Description: Provisioned DynamoDB table name for recording metadata
    Value: !Ref RecordingTable

  RecordingTableArn:
    Description: ARN of the recording DynamoDB table
    Value: !GetAtt RecordingTable.Arn

  HaulCycleTableName:
    Description: Provisioned DynamoDB table name for haul_cycle telemetry
    Value: !Ref HaulCycleTable

  HaulCycleTableArn:
    Description: ARN of the haul_cycle DynamoDB table
    Value: !GetAtt HaulCycleTable.Arn

  StateSegmentTableName:
    Description: Provisioned DynamoDB table name for state_segment timeline items
    Value: !Ref StateSegmentTable

  StateSegmentTableArn:
    Description: ARN of the state_segment DynamoDB table
    Value: !GetAtt StateSegmentTable.Arn

  IngestStateTableName:
    Description: Provisioned DynamoDB table name for Phase 2 upload/worker ingest state
    Value: !Ref IngestStateTable

  IngestStateTableArn:
    Description: ARN of the ingest_state DynamoDB table
    Value: !GetAtt IngestStateTable.Arn

  IngestStateStreamArn:
    Description: DynamoDB Stream ARN of the ingest_state table (NEW_IMAGE)
    Value: !GetAtt IngestStateTable.StreamArn

  PipelineBucketName:
    Description: Provisioned S3 bucket name for video uploads, artifacts, and Parquet lake
    Value: !Ref PipelineBucket

  PipelineBucketArn:
    Description: ARN of the pipeline S3 bucket
    Value: !GetAtt PipelineBucket.Arn
